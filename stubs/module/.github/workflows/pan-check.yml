name: PR Security Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pan-scan:
    name: Detect PAN in PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PAN detection
        env:
          BASE_REF: "origin/${{ github.base_ref }}"
        run: |
          python .github/scripts/pan_detection.py
