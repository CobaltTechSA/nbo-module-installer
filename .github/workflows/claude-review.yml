name: Claude PR Review

# Copy this file to .github/workflows/claude-review.yml in each repository.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: write

jobs:
  claude:
    uses: CobaltTechSA/ci-workflows/.github/workflows/claude-review.yml@main
    secrets: inherit   # CLAUDE_REVIEW_APP_PRIVATE_KEY, to choose the second reviewer
    with:
      enforce: false
      model: opus
